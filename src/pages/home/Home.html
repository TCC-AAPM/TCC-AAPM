<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AAPM · Serviços SENAI Osasco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#3f7bd9;            /* azul principal AAPM */
  --surface:#2f5fb3;       /* azul médio (cards) */
  --surface2:#274f99;      /* azul mais escuro */

  --border:rgba(255,255,255,0.15);

  --accent:#ffffff;        /* branco (padrão AAPM) */
  --accent2:#dbeafe;       /* azul bem claro */

  --text:#ffffff;
  --muted:rgba(255,255,255,0.75);
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:999;
}
.blob{
  position:fixed;border-radius:50%;filter:blur(140px);
  pointer-events:none;z-index:0;
  animation:blobFloat 8s ease-in-out infinite;
}
.blob-1{width:500px;height:500px;background:rgba(200,245,90,0.07);top:-150px;right:-100px;}
.blob-2{width:400px;height:400px;background:rgba(90,245,200,0.04);bottom:-80px;left:-80px;animation-delay:-4s;}
@keyframes blobFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  background:rgba(10,10,15,0.75);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-box{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;color:#0a0a0f;flex-shrink:0;
}
.nav-brand{font-weight:600;font-size:14px;line-height:1.1}
.nav-brand small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.nav-actions{display:flex;gap:8px}
.btn-ghost{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:7px 16px;border-radius:8px;font-family:inherit;font-size:13px;
  cursor:pointer;transition:all .2s;
}
.btn-ghost:hover{border-color:rgba(255,255,255,0.18);color:var(--text)}
.btn-solid{
  background:var(--accent);border:none;color:#0a0a0f;
  padding:7px 16px;border-radius:8px;font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;
}
.btn-solid:hover{background:#d9ff6a;transform:translateY(-1px)}

.hero{
  position:relative;z-index:1;
  padding:48px 28px 36px;
  max-width:900px;margin:0 auto;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:100px;padding:4px 14px;
  font-size:12px;color:var(--muted);margin-bottom:18px;
  animation:fadeUp .5s ease both;
}
.pill-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 6px var(--accent);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{
  font-size:clamp(26px,3.5vw,38px);
  font-weight:700;line-height:1.2;
  letter-spacing:-0.3px;margin-bottom:10px;
  animation:fadeUp .5s .08s ease both;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{
  font-size:14px;line-height:1.7;color:var(--muted);
  max-width:420px;animation:fadeUp .5s .16s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.section{
  position:relative;z-index:1;
  padding:0 28px 56px;
  max-width:900px;margin:0 auto;
}
.section-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:18px;
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.card{
  position:relative;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:22px;
  transition:all .3s cubic-bezier(.23,1,.32,1);
  overflow:hidden;
  animation:cardIn .45s ease both;
}
.card:nth-child(2){animation-delay:.08s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-glow{
  position:absolute;inset:0;background:rgba(200,245,90,0.04);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.card:hover{border-color:rgba(200,245,90,0.22);transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,0.35)}
.card:hover .card-glow{opacity:1}
.card:hover .card-icon svg{stroke:var(--accent)}
.card:hover .card-icon{background:rgba(200,245,90,0.08);border-color:rgba(200,245,90,0.18)}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.card-badge{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;
}
.badge-popular{background:rgba(200,245,90,0.12);color:var(--accent);border:1px solid rgba(200,245,90,0.2)}
.badge-novo{background:rgba(90,245,200,0.12);color:var(--accent2);border:1px solid rgba(90,245,200,0.2)}
.card-icon{
  width:38px;height:38px;background:var(--surface2);
  border:1px solid var(--border);border-radius:11px;
  display:flex;align-items:center;justify-content:center;transition:all .3s;
}
.card-icon svg{width:19px;height:19px;stroke:var(--muted);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}

.card-name{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.card-title{font-size:17px;font-weight:600;margin-bottom:12px}
.card-price{display:flex;align-items:baseline;margin-bottom:8px}
.amt{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.per{font-size:12px;color:var(--muted)}
.card-desc{font-size:13px;line-height:1.65;color:var(--muted);margin-bottom:16px}
.card-hr{height:1px;background:var(--border);margin-bottom:14px}
.card-features{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.feat{display:flex;align-items:center;gap:8px;font-size:13px}
.feat-check{
  width:16px;height:16px;border-radius:50%;
  background:rgba(200,245,90,0.1);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.feat-check svg{width:9px;height:9px;stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.btn-contratar{
  width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:11px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
}
.btn-bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent2));opacity:0;transition:opacity .25s;pointer-events:none}
.btn-contratar:hover .btn-bg{opacity:1}
.btn-contratar:hover{color:#0a0a0f;border-color:transparent;transform:translateY(-1px)}
.btn-label,.btn-arrow{position:relative;z-index:1}
.btn-arrow{transition:transform .2s}
.btn-contratar:hover .btn-arrow{transform:translateX(3px)}
.btn-arrow svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

footer{
  position:relative;z-index:1;text-align:center;
  padding:20px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);
}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div id="root"></div>

<script type="text/babel">
const services = [
  {
    badge:"Popular", badgeClass:"badge-popular",
    icon:<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
    name:"Armário", title:"Armário Individual",
    price:"R$ 90,00", period:"/ semestre",
    desc:"Guarde seus pertences com total segurança durante o período escolar. Acesso exclusivo com cadeado.",
    features:["Acesso 24 horas por dia","Código digital exclusivo","Seguro contra danos incluído","Renovação semestral automática"],
  },
  {
    badge:"Novo", badgeClass:"badge-novo",
    icon:<svg viewBox="0 0 24 24"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M5 12h14"/></svg>,
    name:"Estacionamento", title:"Vaga de Estacionamento",
    price:"R$ 50,00", period:"/ mês",
    desc:"Reserve sua vaga e chegue tranquilo todos os dias. Disponível nos três turnos, coberta e com acesso controlado.",
    features:["Vaga fixa garantida","Cancela automatizada","Monitoramento por câmeras","Turnos manhã, tarde e noite"],
  },
];

function Card({ s }) {
  return (
    <div className="card">
      <div className="card-glow"/>
      <div className="card-top">
        <span className={`card-badge ${s.badgeClass}`}>{s.badge}</span>
        <div className="card-icon">{s.icon}</div>
      </div>
      <div className="card-name">{s.name}</div>
      <div className="card-title">{s.title}</div>
      <div className="card-price">
        <span className="amt">{s.price}</span>
        <span className="per">&nbsp;{s.period}</span>
      </div>
      <div className="card-desc">{s.desc}</div>
      <div className="card-hr"/>
      <div className="card-features">
        {s.features.map(f => (
          <div className="feat" key={f}>
            <div className="feat-check">
              <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2"/></svg>
            </div>
            {f}
          </div>
        ))}
      </div>
      <button className="btn-contratar">
        <div className="btn-bg"/>
        <span className="btn-label">Contratar Serviço</span>
        <span className="btn-arrow">
          <svg viewBox="0 0 16 16"><line x1="2" y1="8" x2="13" y2="8"/><polyline points="9,4 13,8 9,12"/></svg>
        </span>
      </button>
    </div>
  );
}

function App() {
  return (
    <>
      <nav>
        <div className="nav-logo">
          <div className="nav-logo-box">A</div>
          <div className="nav-brand">AAPM<small>SENAI Osasco</small></div>
        </div>
        <div className="nav-actions">
          <button className="btn-ghost">Entrar</button>
          <button className="btn-solid">Cadastrar</button>
        </div>
      </nav>

      <div className="hero">
        <div className="hero-pill"><span className="pill-dot"/>Serviços por assinatura</div>
        <h1>Serviços <em>AAPM</em><br/>Senai Osasco</h1>
        <p>Assine nossos serviços de armário e estacionamento com praticidade total. Sem burocracia, sem complicação.</p>
      </div>

      <div className="section">
        <div className="section-eyebrow">Escolha seu plano</div>
        <div className="cards">
          {services.map(s => <Card key={s.name} s={s}/>)}
        </div>
      </div>

      <footer>Desenvolvido por Isabella Lopreti &amp; Gabriel Duarte · © 2026</footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
